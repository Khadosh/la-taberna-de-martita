<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#0f0804"/>

  <!-- Top bracket bar -->
  <rect x="4" y="4" width="24" height="3" rx="1.5" fill="#7B3808"/>

  <!-- Hooks -->
  <circle cx="11" cy="5.5" r="1.2" fill="#a04a10"/>
  <circle cx="21" cy="5.5" r="1.2" fill="#a04a10"/>

  <!-- Chains -->
  <line x1="11" y1="6.7" x2="11" y2="10.5" stroke="#5a2805" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="6.7" x2="21" y2="10.5" stroke="#5a2805" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sign board -->
  <rect x="5" y="10.5" width="22" height="18" rx="2.5" fill="#7B3808"/>
  <!-- Sign face -->
  <rect x="6.5" y="12" width="19" height="15.5" rx="2" fill="#4a1e03"/>

  <!-- Mug body — center x=14.5, handle to ~x=23.5 → visual center ≈ x=16 -->
  <rect x="10.5" y="15" width="8" height="10" rx="1.2" fill="#d97706"/>
  <!-- Beer fill -->
  <rect x="11.3" y="16.5" width="6.4" height="8" rx="0.8" fill="#b45309"/>
  <!-- Handle -->
  <path d="M18.5 16.5 Q23.5 16.5 23.5 20 Q23.5 23.5 18.5 23.5"
        stroke="#d97706" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Foam centered on mug body (x=14.5) -->
  <ellipse cx="14.5" cy="15" rx="4.5" ry="2" fill="#fde68a"/>
  <circle cx="11.5" cy="13.8" r="2.2" fill="#fde68a"/>
  <circle cx="14.5" cy="13"   r="2.5" fill="#fde68a"/>
  <circle cx="17.5" cy="13.8" r="2.2" fill="#fde68a"/>

  <!-- Highlight -->
  <rect x="12" y="16.5" width="1.5" height="7.5" rx="0.75" fill="rgba(255,255,255,0.18)"/>
</svg>
