<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#0f0804"/>

  <!-- Mug body -->
  <rect x="5" y="12" width="17" height="14" rx="2" fill="#9B4A10"/>
  <!-- Beer inside -->
  <rect x="6.5" y="14" width="14" height="11.5" rx="1.5" fill="#b45309"/>

  <!-- Handle -->
  <path d="M22 14.5 Q28 14.5 28 18.5 Q28 22.5 22 22.5"
        stroke="#9B4A10" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Foam base -->
  <ellipse cx="13.5" cy="12" rx="8.5" ry="3.5" fill="#fde68a"/>
  <!-- Foam bumps -->
  <circle cx="7"  cy="10.5" r="3"   fill="#fde68a"/>
  <circle cx="11" cy="9.5"  r="3.5" fill="#fde68a"/>
  <circle cx="15.5" cy="9" r="3.5"  fill="#fde68a"/>
  <circle cx="20" cy="10.5" r="3"   fill="#fde68a"/>

  <!-- Highlight stripe -->
  <rect x="8" y="14.5" width="2" height="10" rx="1" fill="rgba(255,255,255,0.18)"/>
</svg>
